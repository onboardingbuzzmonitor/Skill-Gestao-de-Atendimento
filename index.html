lo Fale Conosco… fique atento à caixa de SPAM”) é enviado para saudação, story, reclamação e fornecedor. Em 200 das 662 obrigatórias respondidas, essa foi a única resposta; sem contá-la, a cobertura seria de 63,9% e o IAA de 6,9.", "metrica": "200 de 662 só com automação"}, {"tom": "risk", "titulo": "Prioridade registrada e criticidade lida divergem", "texto": "97 tickets que a leitura classificou como criticidade alta estavam com prioridade Baixa; só 4 tickets do mês tinham prioridade Média ou Alta. Na fila crítica, 8 obrigatórias de criticidade alta estão sem resposta registrada, 7 delas em comentários públicos; a mais antiga, de 29 dias, acusa a marca de apagar comentários de alunos.", "metrica": "97 casos com prioridade Baixa"}, {"tom": "info", "titulo": "Parte das conversas etiquetadas como spam exigia resposta", "texto": "A tag “9. Spam” está em 1.841 interações do mês (35,0%). Das 556 conversas com texto etiquetadas como “9. Spam” ou “Mensagem Não Relacionada”, 42 eram ruído; a maioria era elogio em posts de parceiros, 98 exigiam resposta e 9 eram críticas, como “Estou tentando cancelar e não estou conseguindo”.", "metrica": "98 exigiam resposta"}, {"tom": "opp", "titulo": "Dúvidas comerciais são a maior demanda de SAC", "texto": "As 430 dúvidas giram em torno de valores e planos (100), Wellhub/TotalPass (61), novas unidades (34), aula experimental (27) e horário (23). 411 foram respondidas, muitas com o link geral de unidades; na avaliação, a personalização média ficou em 4,1. As respostas com informação específica ou no tom da campanha (“IA nada, é o próprio Naldo…”) tiveram notas acima de 9.", "metrica": "430 dúvidas"}], "leituras": {"depoimentos": "Sentimento automático: 45,2% positivo, 44,4% neutro e 10,4% negativo (6,5% em agosto). O Instagram concentra 5.088 das 5.267 interações, e 3.767 chegaram por canal privado. 34 das 214 reclamações não tinham nenhuma mensagem marcada como negativa: cobranças secas como “Aguardo retorno” saem neutras.", "atendimento": "Foram 3.040 respostas no mês (+27%): 2.013 com analista identificado (Thiago Camargo 1.294, Júlia Lopes 551 e Rebeca Tedesco 168), 915 com padrão de automação e 112 sem autor. Pelos tickets atribuídos, Thiago é responsável por 1.153 (87,2% respondidos), Júlia por 745 (70,9%) e Rebeca por 138 (98,6%), com 93% a 96% das respostas no SLA. A mediana de 4s nos tickets de Rebeca vem da resposta automática, que foi a 1ª resposta em 98 dos 136 tickets respondidos dela. No total, o tempo mediano da 1ª resposta foi de 20min 36s (7s em agosto), e 637 das 723 obrigatórias foram respondidas no SLA de 24h (88,1%).", "tickets": "São 2.036 tickets: 2.014 finalizados e 22 em aberto (4 em agosto). Quase todos (2.032, ou 99,8%) estão com prioridade Baixa, inclusive 97 casos de criticidade alta pela leitura; a fila crítica tem 61 obrigatórias sem resposta registrada, 8 de criticidade alta. 294 pessoas abriram dois ou mais tickets (842, ou 41,4%): 511 deles são marcações e engajamento, e 101 são reclamações.", "temas": "Elogio & engajamento (1.217) e Sem texto / ruído (979) somam 68,9% das demandas, vindas sobretudo de marcações em stories e de comentários em posts de parceiros. A demanda de SAC está em Dúvida (430), Solicitação (278) e Reclamação (214); nas reclamações, pesam o desligamento na T4 (27), não conseguir cancelar (19), cobrança indevida (17) e cobrança após pedido de cancelamento (14). As tags de classificação da equipe aparecem em 4.892 das 5.267 mensagens (92,9%): as mais usadas são “9. Spam” (35,0%), “9. Mensagem Não Relacionada” (34,7%), “6. Engajamento” (31,3%) e “3. Dúvida” (17,6%). Nos tickets, só 1 tem tag de classificação.", "avaliacao": "IAA 7,3 (Bom), com 8,7 em cobertura e processo e 6,4 em qualidade das respostas, estimada numa amostra estratificada de 104 das 3.040 respostas. Língua (8,8) e clareza (8,1) têm as maiores médias, e as respostas de engajamento seguem o tom da marca. As médias mais baixas são de personalização (4,1), efetividade (5,6) e empatia (3,4), puxadas pelas reclamações e pelo texto automático.", "recomendacoes": "Primeiro, os casos com risco financeiro e de reputação (cancelamento, cobrança e T4); depois, ajustes de automação, etiquetas e prioridade."}, "recomendacoes": [{"kind": "risk", "prazo": "48h", "dono": "SAC financeiro + gestão das unidades", "titulo": "Zerar a fila de cancelamento e cobrança", "motivo": "86 conversas sobre cancelamento, cobrança ou reembolso, 54 de criticidade alta, com menções a Reclame Aqui e processo.", "plano": "Levantar os tickets, confirmar o status de cada cancelamento e estorno e responder com prazo e comprovante. Criar uma opção de cancelamento para planos fechados online, que hoje o bot não oferece.", "impacto": "Menos risco de Reclame Aqui e Procon; cada obrigatória resolvida entra na cobertura."}, {"kind": "risk", "prazo": "24h", "dono": "Marketing + franquia Alto do Bueno T4", "titulo": "Posicionar-se sobre a unidade T4", "motivo": "27 conversas, comentários públicos, abaixo-assinado e acusações de comentários apagados; a acusação mais antiga (T220) está há 29 dias sem resposta.", "plano": "Enviar uma resposta humana e assinada às alunas por Direct e nos comentários, sem apagar críticas. Alinhar com a franquia como ficam as aulas de Body Pump e Body Balance e acompanhar a conversa diariamente.", "impacto": "Contém a crise e tira da fila crítica dois casos de criticidade alta (T220 e T1459)."}, {"kind": "risk", "prazo": "7 dias", "dono": "Atendimento + responsável pelo agente n8n", "titulo": "Reescrever a resposta automática e não contá-la como atendimento", "motivo": "915 respostas (30,2%) com o mesmo texto; 200 obrigatórias só o receberam; as piores notas da avaliação são desse texto aplicado a reclamações.", "plano": "Usar a automação só como acolhida (“recebemos sua mensagem, um analista responde em até X horas”), sem dizer que a marca só atende pelo “Fale Conosco”. Desligá-la para stories e engajamento e mandar reclamação e cancelamento direto para a fila humana.", "impacto": "Sem o texto automático, a cobertura das obrigatórias é de 63,9% (IAA 6,9); responder essas 200 com analista leva a cobertura com resposta humana a 91,6%."}, {"kind": "risk", "prazo": "48h", "dono": "Coordenação de SAC", "titulo": "Responder a fila crítica, começando pelos comentários públicos", "motivo": "61 obrigatórias sem resposta registrada, 8 de criticidade alta, 7 delas em comentários públicos (T220, T621, T1264, T2450, T2648, T3015 e T3127).", "plano": "Resposta pública curta e humana, seguida de contato por Direct em até 24h, registrada na Buzzmonitor.", "impacto": "Responder todas as obrigatórias leva o IAA de 7,3 para 7,5."}, {"kind": "info", "prazo": "15 dias", "dono": "Responsável pelo agente n8n", "titulo": "Corrigir etiquetas e prioridade automáticas", "motivo": "Das 556 conversas etiquetadas como spam ou não relacionadas, só 42 eram ruído e 98 exigiam resposta; 97 casos de criticidade alta estavam com prioridade Baixa.", "plano": "Subir para prioridade Alta as conversas que falem de cancelamento, cobrança, estorno, Reclame Aqui, Procon ou processo. Revisar toda semana uma amostra do que foi marcado como spam.", "impacto": "Casos graves passam a aparecer na fila certa, em vez de se perderem entre o engajamento."}, {"kind": "opp", "prazo": "15 dias", "dono": "Marketing + SAC", "titulo": "Criar respostas prontas específicas para as dúvidas comerciais", "motivo": "430 dúvidas, lideradas por valores e planos (100), Wellhub/TotalPass (61) e novas unidades (34); muitas recebem só o link genérico.", "plano": "Montar uma base com a condição real de cada tema (planos que aceitam Wellhub e TotalPass, regra do R$ 9,90 e valor dos meses seguintes, datas de inauguração), sempre pedindo cidade ou unidade, e fixar destaques nos stories.", "impacto": "Sobe personalização e efetividade (Pilar A) e converte mais leads."}, {"kind": "info", "prazo": "30 dias", "dono": "Social media", "titulo": "Responder stories no mesmo dia e variar as fórmulas", "motivo": "Na amostra, respostas a stories chegaram até 12 dias depois, e frases como “Deu até vontade de treinar também” se repetem em 16 respostas; tempo médio de 11h 54min.", "plano": "Reservar janelas diárias para menções e stories e manter um banco de variações por situação.", "impacto": "Melhora consistência (4,0) e proximidade (5,9)."}], "notas_metodo": ["Coleta em censo: 10.290 registros de 01/09 a 30/09/2026 (fuso de Brasília) nos 3 canais do CRM — Instagram @bluefitacademia, Facebook Bluefit e TikTok @bluefit —, comparados a 02/08–31/08/2026.", "A frente foi definida por rede e canal, porque as tags de ticket da conta são só de sistema (“replied”, “Sentiment_Edited”).", "As 3.188 demandas foram lidas e classificadas; as etiquetas da equipe e do agente n8n serviram de ponto de partida e foram corrigidas na leitura. Demandas sem texto (story, figurinha, mídia) ou só com emoji ou @ foram classificadas pela estrutura.", "O Pilar A foi estimado numa amostra estratificada (tema × canal, proporcional) de 104 das 3.040 respostas; a automação é 30,8% da amostra e 30,2% do total. As demais respostas não têm nota individual.", "Respostas automáticas contam como resposta na cobertura, como define a métrica. Sem elas, a cobertura das obrigatórias seria de 63,9% e o IAA de 6,9 (cálculo próprio com a fórmula do IAA).", "SLA de 24h adotado por padrão. Status e prioridade são uma fotografia da coleta (01/10/2026). CPFs e números semelhantes foram ocultados nas mensagens.", "Produtividade por analista: responsável atribuído ao ticket e autor de cada resposta (reply_sent_by_login); o tempo da 1ª resposta do ticket inclui a resposta automática.", "Tom de voz de referência, inferido das publicações próprias do período: informal e motivacional, em 2ª pessoa, com o nome da pessoa, emojis da marca (💙💪🚀) e bordões como “Bora pra cima!”. Cordialidade e proximidade foram medidas contra esse tom.", "Na seção de tags entram só as tags de classificação, que começam por número de 1 a 9 /* ================================================================ 1 · VISÃO GERAL */
function pageVisao(){
  const av = D.avaliacao, f = D.funil, tk = D.tickets;
  const top = f[0].n || 1;
  const fcols = ['#FF6A13', '#F47B2A', '#E8590C', '#E11D2E', '#B5121F'];
  const funnel = `<div class="funnel">${f.map((s, i) => {
    const w = Math.max(100 * s.n / top, 1.5), inside = w > 18;
    const drop = i ? s.n - f[i - 1].n : null;
    return `<div class="fstep"><div class="fl"><b>${esc(s.etapa)}</b><span>${esc(s.nota || '')}</span></div>
      <div class="fbar"><i style="width:${w}%;background:${fcols[i % fcols.length]}"></i>
      <span class="fn ${inside ? 'in' : ''}" style="${inside ? 'left:0' : 'left:calc(' + w + '% + 2px)'}">${fmt(s.n)}${drop != null && drop < 0 ? ` <span class="mono" style="font-size:11px;font-weight:500;${inside ? 'color:rgba(255,255,255,.85)' : 'color:var(--muted)'}">−${fmt(-drop)}</span>` : ''}</span></div></div>`;
  }).join('')}</div>`;
  const kp = [
    kpi({num: fmt(K.interacoes.v), lab: 'interações recebidas', delta: dl(K.interacoes.d, null), sub: joinSub(`${fmt(K.pessoas.v)} pessoas`, prevTxt(K.interacoes.prev)), bar: '#FF6A13'}),
    kpi({num: fmt(K.tickets.v), lab: 'tickets', delta: dl(K.tickets.d, null), sub: `${fmt(K.core_sac.v)} de SAC · ${fmt(K.core_sac.fora)} fora do escopo`, bar: '#F79A3E'}),
    kpi({num: fmt(K.exigiam.v), lab: 'exigiam resposta', sub: `${pc(K.exigiam.pct)} das demandas, pela leitura`, bar: '#E8590C'}),
    kpi({num: `${fmt(K.obrig_respondidas.v)}<small>/${fmt(K.obrig_respondidas.de)}</small>`, lab: 'respondidas', color: 'var(--red)', sub: `${pc(K.obrig_respondidas.pct)} das que exigiam resposta`, bar: '#E11D2E'}),
    kpi({num: esc(D.atendimento.tempo_medio_label), lab: 'tempo médio da 1ª resposta', sub: `mediana ${esc(K.tempo_mediano.label)} · ${pc(D.atendimento.automacao_pct)} com padrão de automação`, bar: '#0E9F6E'}),
    kpi({num: fmt(K.abertos.v), lab: 'tickets em aberto', delta: dl(K.abertos.d, false), sub: `${pc(K.abertos.pct)} do total · idade média ${dec(tk.idade_media_d)} dias`, bar: '#E8590C'}),
    kpi({num: fmt(K.respostas.v), lab: 'respostas da marca', delta: dl(K.respostas.d, true), sub: joinSub(`${fmt(D.atendimento.por_canal.privado || 0)} no privado`, prevTxt(K.respostas.prev)), bar: '#F2A900'}),
    kpi({num: dec(av.iaa), lab: 'Avaliação do atendimento', color: av.faixa.cor, sub: `IAA 0–10 · ${esc(av.faixa.label)} · ver aba`, bar: av.faixa.cor, goto: 'avaliacao'}),
  ].join('');
  const ach = (N.achados || []).map(a => `<div class="ins ${a.tom || 'info'}"><div class="tag"><span class="tagk ${a.tom || 'info'}">${({risk:'risco',opp:'oportunidade',info:'leitura'})[a.tom] || 'leitura'}</span></div>
     <h4>${esc(a.titulo)}</h4><p>${esc(a.texto)}</p>${a.metrica ? `<span class="met">${esc(a.metrica)}</span>` : ''}</div>`).join('');
  const fr = (tk.frentes || []).map(x => {
    const resp = x.respondidos || 0;
    return `<div class="row"><div class="rl">${esc(x.frente)}</div>
      ${meter([{v: resp, c: '#0E9F6E', l: 'respondidos'}, {v: x.total - resp, c: '#E8590C', l: 'sem resposta'}], x.total)}
      <div class="rv"><b>${fmt(resp)}</b> de ${fmt(x.total)} respondidos</div></div>
      <div class="small" style="margin:-2px 0 6px">${fmt(x.obrigatorias)} exigiam resposta (${fmt(x.obrig_respondidas)} respondidas) · ${fmt(x.crit_alta)} de criticidade alta · prioridade ${Object.entries(x.prioridade).map(([k, v]) => `${esc(k)} ${v}`).join(', ')}</div>`;
  }).join('');
  const comp = (D.comparacao || []).filter(c => c.anterior != null).map(c => {
    const upGood = ({'Tickets em aberto': false, 'Sentimento negativo (%)': false, 'Respostas com padrão de automação': null, 'Interações recebidas': null, 'Pessoas únicas': null, 'Tickets': null, 'Publicações próprias': null})[c.m];
    const ug = upGood === undefined ? true : upGood;
    return `<tr><td>${esc(c.m)}</td><td class="n">${c.pct ? pc(c.anterior) : fmt(c.anterior)}</td><td class="n"><b>${c.pct ? pc(c.atual) : fmt(c.atual)}</b></td><td class="n">${dl(c.d, ug)}</td></tr>`;
  }).join('');
  return head(`Gestão de SAC · ${esc(M.periodo.label)}`, esc(N.headline || 'Gestão de SAC'), esc(N.lead || ''))
   + `<div class="grid g4">${kp}</div>`
   + sec('Funil do atendimento', 'Do que chegou ao que foi respondido dentro do SLA. As etapas 3 a 5 vêm da leitura de cada conversa.',
       `<div class="card">${funnel}<div class="note">Além das obrigatórias, ${fmt(D.atendimento.cobertura[1].respondidas)} de ${fmt(D.atendimento.cobertura[1].n)} conversas em que a resposta era recomendável e ${fmt(D.atendimento.cobertura[2].respondidas)} de ${fmt(D.atendimento.cobertura[2].n)} dispensáveis receberam resposta.</div></div>`)
   + (ach ? sec('O que o mês mostra', '', `<div class="grid g2">${ach}</div>`) : '')
   + sec('Onde a fila está', '', `<div class="grid g2">${card('Tickets por frente', fr + `<div class="note">Frente = tag do ticket na plataforma.</div>`)}
       ${card('Comparação com ' + esc(M.anterior_label || 'o período anterior'), comp ? `<div class="tscroll"><table class="t"><thead><tr><th>Indicador</th><th class="n">Anterior</th><th class="n">Atual</th><th class="n">Var.</th></tr></thead><tbody>${comp}</tbody></table></div>` : '<div class="small">Sem dados do período anterior.</div>')}</div>`);
}

/* ---------------------------------------------------------------- diagnóstico de coleta por rede */
const fmtDate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
function coverageSec(){
  const cv = D.cobertura_redes; if (!cv || !cv.redes || !cv.redes.length) return '';
  const ST = {ok: '#0E9F6E', quieta: '#8a8178', parada: '#E11D2E', vazia: '#F2A900'};
  const mx = Math.max(1, ...cv.redes.flatMap(r => r.mensal)), ML = cv.meses_label || [];
  const spark = r => { const bw = 9, gp = 3, H = 26;
    return `<svg class="spark" width="${r.mensal.length * (bw + gp)}" height="${H + 12}" role="img" aria-label="interações por mês">`
      + r.mensal.map((v, i) => { const hh = v ? Math.max(2, H * v / mx) : 1.5;
          return `<rect x="${i * (bw + gp)}" y="${(H - hh).toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="1.5" fill="${v ? (ST[r.status] || '#8a8178') : 'var(--line)'}"><title>${esc(ML[i] || '')}: ${fmt(v)} interações</title></rect>`; }).join('')
      + ML.map((m, i) => `<text x="${i * (bw + gp) + bw / 2}" y="${H + 10}" text-anchor="middle">${esc((m || '').charAt(0))}</text>`).join('') + '</svg>'; };
  const rows = cv.redes.map(r => `<tr><td class="who"><span class="dot" style="background:${NET_COR[r.rede] || '#8a8178'}"></span>${esc(r.label)}<div class="sm">${(r.contas || []).map(esc).join(', ')}</div></td>
     <td class="n">${fmt(r.periodo.publicacoes)}</td><td class="n"><b>${fmt(r.periodo.interacoes)}</b></td><td class="n">${fmt(r.historico.interacoes)}</td>
     <td>${spark(r)}</td><td class="n">${fmtDate(r.ultimo_registro)}</td><td><span class="stc" style="background:${ST[r.status] || '#8a8178'}">${esc(r.status_label)}</span></td></tr>`).join('');
  const fl = [];
  cv.redes.filter(r => r.status === 'parada').forEach(r => fl.push(`<b>${esc(r.label)}</b>: ${fmt(r.historico.interacoes)} interações no histórico e nenhum registro desde ${fmtDate(r.ultimo_registro)} — nem as publicações da marca. Indício de coleta interrompida: reconectar a conta no CRM.`));
  const vaz = cv.redes.filter(r => r.status === 'vazia');
  if (vaz.length) fl.push(`<b>${vaz.map(r => esc(r.label)).join(', ')}</b>: nenhum registro desde ${fmtDate(cv.desde)}, nem publicações da marca. Confirmar se as contas estão ativas e conectadas.`);
  return '<div id="cobertura">' + sec('Diagnóstico de coleta por rede', `Separa “sem demanda” de “sem coleta”: publicações da marca e interações no período, histórico desde ${fmtDate(cv.desde)} e o último registro de cada rede.`,
    `<div class="card"><div class="tscroll"><table class="t"><thead><tr><th>Rede</th><th class="n">Publicações da marca</th><th class="n">Interações no período</th><th class="n">Interações desde ${dd(cv.desde)}</th><th>Interações por mês</th><th class="n">Último registro</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>${fl.length ? `<div class="flag">${fl.join('<br>')}</div>` : ''}</div>`) + '</div>';
}

/* ================================================================ 2 · DEPOIMENTOS */

  const total = dep.total;
  const redes = dep.por_rede.map(r => `<div class="row ${r.total ? '' : 'zero'}"><div class="rl"><span class="dot" style="background:${r.cor}"></span>${esc(r.label)}</div>
     ${meter([{v: r.pos, c: T.pos, l: 'positivo'}, {v: r.neu, c: T.neu, l: 'neutro'}, {v: r.neg, c: T.neg, l: 'negativo'}], r.total)}
     <div class="rv">${r.total ? `<b>${fmt(r.total)}</b> · ${pc(100 * r.total / (total || 1))}` : 'sem interações'}</div></div>`).join('');

     <div class="row"><div class="rl">${esc(M.periodo.label)}</div><div class="hbar"><i style="width:${100 * total / (K.interacoes.prev || total || 1)}%;background:#FF6A13"></i></div><div class="rv"><b>${fmt(total)}</b> ${dl(K.interacoes.d, null)}</div></div>` : '';
  const fa = (dv.falso_alarme || []).map(x => `<div class="post"><div class="meta"><span class="who">@${esc(x.autor)}</span>${pill('NEGATIVE')}<span>→ leitura:</span>${pill(x.sent_lido)}</div><div class="verb">${esc(x.resumo)}</div></div>`).join('');
  const rn = (dv.reclamacoes_nao_detectadas || []).map(x => `<div class="post"><div class="meta"><span class="who">@${esc(x.autor)}</span>${pill(x.sent)}<span>${esc(CANAL[x.canal])}</span><span>· ${dd(x.quando)}</span></div><div class="verb">“${esc(x.texto)}”</div>${verBtn(x.link, x.canal) ? `<div class="foot">${verBtn(x.link, x.canal)}</div>` : ''}</div>`).join('');
  const mural = (dep.mural || []).map(m => `<div class="post"><div class="meta"><span class="who">@${esc(m.autor)}</span><span>${esc(m.tipo)}</span><span>· ${dh(m.quando)}</span>${pill(m.sent)}</div>
     <div class="verb">${esc(m.texto)}</div><div class="foot">${tchip(m.tema)}<span class="small">${m.respondida ? '✓ respondida' : 'sem resposta registrada'}</span>${verBtn(m.link, m.canal)}</div></div>`).join('');
  const ger = (D.publicacoes.geradores || []).map(g => `<div class="row"><div class="rl" style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500"><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc((g.link || '').replace(/^https?:\/\/(www\.)?/, '').slice(0, 34))}</a></div>
     <div class="small">${g.no_periodo ? esc((g.texto || '').slice(0, 110)) + '…' : 'post publicado antes do período'}</div><div class="rv"><b>${fmt(g.n)}</b> interações</div></div>`).join('');
  onChart('depoimentos', 'c_sent_dia', (w, h) => svgBars(w, h, {labels: DIAS, stacked: true, series: [
      {name: 'Positivo', color: 'var(--pos)', data: dep.serie.map(x => x.pos)},
      {name: 'Neutro', color: 'var(--neu)', data: dep.serie.map(x => x.neu)},

  onChart('depoimentos', 'c_hora_dep', (w, h) => svgBars(w, h, {labels: HORAS, series: [{name: 'Interações', color: '#F79A3E', data: dep.por_hora}]}));

       ${card('Volume diário por sentimento', canvas('c_sent_dia') + legend([{c: 'var(--pos)', l: 'Positivo'}, {c: 'var(--neu)', l: 'Neutro'}, {c: 'var(--neg)', l: 'Negativo'}]), 's2')}</div>`
   + `<div class="grid g2" style="margin-top:14px">${card('Sentimento por rede', redes + (silent.length ? `<div class="flag">${fmt(silent.length)} das ${fmt(dep.por_rede.length)} redes conectadas não registraram nenhuma interação no período (${silent.map(esc).join(', ')}).${D.cobertura_redes ? ' O diagnóstico de coleta por rede, logo abaixo, mostra quais estão coletando e quais pararam.' : ' Vale conferir se a conexão do CRM está ativa.'}</div>` : ''))}
       ${card('Por tipo de interação', tipos + `<div style="margin-top:14px">${meter([{v: pub, c: '#FF6A13', l: 'público'}, {v: pri, c: '#1F6FB2', l: 'privado'}], total)}</div>` + legend([{c: '#FF6A13', l: `Público · ${fmt(pub)}`}, {c: '#1F6FB2', l: `Privado (mensagens diretas, marcações em story) · ${fmt(pri)}`}]))}</div>`
   + coverageSec()
   + `<div class="grid g2" style="margin-top:14px">${card('Volume mensal', ant || '<div class="small">Sem período anterior.</div>')}${card('Interações por hora do dia', canvas('c_hora_dep', 'sm'))}</div>`
   + sec('O que o sentimento automático não viu', `Comparação entre o sentimento atribuído pela plataforma e a leitura de cada conversa: ${fmt(dv.reclamacoes_detectadas)} de ${fmt(dv.reclamacoes)} reclamações foram marcadas como negativas.`,
       `<div class="grid g2">${card(`Reclamações que chegaram como não negativas · ${fmt((dv.reclamacoes_nao_detectadas || []).length)}`, `<div class="stack">${rn || '<div class="small">Nenhuma.</div>'}</div>`)}
        ${card(`Negativos automáticos que não eram problema · ${fmt((dv.falso_alarme || []).length)} de ${fmt(dv.interacoes_negativas)}`, `<div class="stack">${fa || '<div class="small">Nenhum.</div>'}</div><div class="note">Use o sentimento automático como termômetro de tom; para triagem, use tema e exigência de resposta.</div>`)}</div>`)
   + sec('Mural de depoimentos recentes', 'Últimas mensagens com texto, com o tema lido e se houve resposta registrada. Ruído e mídia sem texto ficam de fora.', `<div class="grid g3">${mural}</div>`)
   + (ger ? sec('Posts que mais geraram conversa', 'Publicações com mais interações públicas no período — inclusive posts antigos que seguem recebendo comentários.', card('', ger)) : '');

/* ================================================================ 3 · ATENDIMENTO */
function peakNote(inter, resp){
  const pk = a => a.reduce((b, v, i) => v > a[b] ? i : b, 0);
  const out = sum(inter.filter((v, h) => h < 8 || h >= 19));
  const ri = pk(inter), rr = pk(resp);
  return `Pico de interações às ${ri}h${sum(resp) ? `; pico de respostas às ${rr}h` : '; nenhuma resposta no período'}. ${fmt(out)} das ${fmt(sum(inter))} interações (${pc(100 * out / (sum(inter) || 1))}) chegaram antes das 8h ou depois das 19h.`;
}
function pageAtend(){
  const at = D.atendimento, sla = at.sla_h, slaS = sla * 3600;
  const mean = at.tempo_medio_s;
  const g = gauge({value: mean || 0, max: 2 * slaS, label: esc(at.tempo_medio_label), aria: 'Tempo médio da primeira resposta',
    bands: [{from: 0, to: slaS, color: '#0E9F6E'}, {from: slaS, to: 2 * slaS, color: '#E11D2E'}],
    ticks: [{v: 0, l: '0'}, {v: slaS, l: sla + 'h'}, {v: 2 * slaS, l: 2 * sla + 'h'}]});
  const se = at.sla_efetivo;
  const cobRows = (arr, label) => arr.map(x => `<div class="row"><div class="rl">${esc(label(x.grupo))}</div>
     ${meter([{v: x.respondidas, c: '#0E9F6E', l: 'respondidas'}, {v: x.n - x.respondidas, c: '#E8590C', l: 'sem resposta'}], x.n)}
     <div class="rv"><b>${fmt(x.respondidas)}</b>/${fmt(x.n)} · obrig. ${fmt(x.obrig_respondidas)}/${fmt(x.obrigatorias)}</div></div>`).join('');
  const resp = (at.por_responsavel || []).map(r => `<div class="row"><div class="rl">${esc(r.quem)}</div><div class="hbar"><i style="width:${100 * r.n / (at.respostas || 1)}%;background:#FF6A13"></i></div><div class="rv"><b>${fmt(r.n)}</b> respostas</div></div>`).join('');
  const tr = (at.tempo_por_rede || []).map(r => `<tr><td>${esc(r.label)}</td><td class="n">${fmt(r.n)}</td><td class="n"><b>${esc(r.medio_label)}</b></td></tr>`).join('');
  const redesResp = (D.redes_crm || []).map(r => { const x = (at.por_rede || []).find(y => y.rede === r); return `<div class="row ${x ? '' : 'zero'}"><div class="rl"><span class="dot" style="background:${NET_COR[r] || '#8a8178'}"></span>${esc(redeLabel(r))}</div><div class="hbar"><i style="width:${x ? 100 * x.n / (at.respostas || 1) : 0}%;background:${NET_COR[r] || '#8a8178'}"></i></div><div class="rv">${x ? `<b>${fmt(x.n)}</b>` : '0'}</div></div>`; }).join('');
  const paresArr = (D.avaliacao.respostas || []).map(p => `<div class="card"><div class="post" style="background:none;border:none;padding:0">
     <div class="meta"><span class="who">@${esc(p.autor || '?')}</span><span>${esc(CANAL[p.canal] || p.canal)}</span><span>· ${dh(p.quando)}</span><span>· respondida em ${esc(p.tempo_label)}</span></div></div>
     <div class="pair"><div class="bubble in"><span class="bl">Mensagem</span>${textOrDash(p.msg)}</div><div class="bubble out"><span class="bl">Resposta da marca · ${esc(p.enviado_por)}</span>${esc(p.resposta)}</div></div>
     <div class="foot" style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">${tchip(p.tema)}${p.excluida ? '<span class="crit baixa">fora do fluxo</span>' : `<span class="crit" style="background:${p.faixa.cor};color:#fff">nota ${dec(p.nota)}</span>`}${verBtn(p.link, p.canal)}<button type="button" class="chip" data-goto="avaliacao" style="cursor:pointer">${esc(p.rid)} · ver avaliação</button></div></div>`);
  const pares = paresArr.slice(0, 8).join(''), paresMais = paresArr.slice(8).join('');
  onChart('atendimento', 'c_dia_resp', (w, h) => svgBars(w, h, {labels: DIAS, series: [{name: 'Interações recebidas', color: 'var(--neu)', data: at.interacoes_dia}],
      line: {name: 'Respostas da marca', color: 'var(--bz)', data: at.serie.map(x => x.n)}}));
  onChart('atendimento', 'c_hora_resp', (w, h) => svgBars(w, h, {labels: HORAS, series: [{name: 'Interações', color: 'var(--neu)', data: at.interacoes_hora}, {name: 'Respostas', color: 'var(--bz)', data: at.por_hora}]}));
  return head('Atendimento & produtividade', 'Quem respondeu, quando e em quanto tempo', esc((N.leituras || {}).atendimento || ''))
   + `<div class="grid g4">${[
       kpi({num: fmt(at.respostas), lab: 'respostas da marca', delta: dl(K.respostas.d, true), sub: `${fmt(at.respostas_sem_texto || 0)} resposta(s) sem texto não entram na conta`, bar: '#FF6A13'}),
       kpi({num: `${fmt(K.taxa_resposta.v)}<small>/${fmt(K.taxa_resposta.de)}</small>`, lab: 'demandas respondidas', sub: joinSub(`${pc(K.taxa_resposta.pct)} das demandas`, prevTxt(K.tickets_respondidos.prev, ' tickets')), bar: '#E8590C'}),
       kpi({num: esc(at.tempo_medio_label), lab: 'tempo médio da 1ª resposta', sub: `mediana ${esc(at.tempo_mediano_label)} · máximo ${esc(at.tempo_max_s != null ? (at.tempo_max_s < 60 ? Math.round(at.tempo_max_s) + 's' : Math.round(at.tempo_max_s / 60) + 'min') : '—')}`, bar: '#0E9F6E'}),
       kpi({num: pc(at.automacao_pct), lab: 'com padrão de automação', sub: 'resposta em menos de 60 segundos', bar: '#F2A900'})].join('')}</div>`
   + `<div class="grid g3" style="margin-top:14px">${card('SLA · tempo médio de resposta', `<div class="gwrap">${g}<div class="formula">Acordado: <b>${sla}h</b> · ${fmt(at.dentro_sla)} de ${fmt(at.tickets_respondidos)} tickets respondidos dentro do SLA</div></div>
         <div class="flag">SLA efetivo: só <b>${fmt(se.no_sla)} de ${fmt(se.de)}</b> conversas que exigiam resposta foram respondidas dentro do prazo (${pc(se.pct)}). O tempo médio só mede quem foi respondido.</div>`)}
       ${card('Cobertura por canal e por frente', cobRows(at.por_canal_cob, g => CANAL[g] || g) + '<div style="height:10px"></div>' + cobRows(at.por_frente_cob, g => g) + legend([{c: '#0E9F6E', l: 'respondidas'}, {c: '#E8590C', l: 'sem resposta registrada'}]), 's2')}</div>`
   + `<div class="card" style="margin-top:14px"><h3>Interações recebidas × respostas da marca, por dia</h3>${canvas('c_dia_resp')}${legend([{c: 'var(--neu)', l: 'Interações recebidas (barras)'}, {c: 'var(--bz)', l: 'Respostas da marca (linha)'}])}</div>`
   + `<div class="grid g2" style="margin-top:14px">${card('Por hora do dia', canvas('c_hora_resp', 'sm') + legend([{c: 'var(--neu)', l: 'Interações'}, {c: 'var(--bz)', l: 'Respostas'}]) + `<div class="note">${peakNote(at.interacoes_hora, at.por_hora)}</div>`)}
       <div class="stack">${card('Respostas por responsável', resp + '<div class="note">“Provável automação”: resposta enviada em menos de 60s e sem analista identificado no registro.</div>')}
       ${card('Tempo médio por rede', tr ? `<div class="tscroll"><table class="t"><thead><tr><th>Rede</th><th class="n">Tickets</th><th class="n">Tempo médio</th></tr></thead><tbody>${tr}</tbody></table></div>` : '<div class="small">Sem respostas.</div>')}</div></div>`
   + prodSec()
   + csatSec()
   + `<div class="grid g2" style="margin-top:14px">${card('Respostas por rede', redesResp)}${card('Respostas por canal', `<div class="row"><div class="rl">Público</div>${meter([{v: at.por_canal.publico || 0, c: '#FF6A13'}], at.respostas || 1)}<div class="rv"><b>${fmt(at.por_canal.publico || 0)}</b></div></div><div class="row"><div class="rl">Privado</div>${meter([{v: at.por_canal.privado || 0, c: '#1F6FB2'}], at.respostas || 1)}<div class="rv"><b>${fmt(at.por_canal.privado || 0)}</b></div></div>
         <div class="note">${fmt(D.depoimentos.por_canal.privado)} interações privadas no período${(at.por_canal.privado || 0) ? '' : ', nenhuma com resposta registrada'}.</div>`)}</div>`
   + (pares ? sec('Respostas pareadas com a mensagem original', 'Cada resposta da marca ao lado do que ela respondeu, com a nota da avaliação.', `<div class="grid g2">${pares}</div>${paresMais ? `<details class="more"><summary>Ver as outras ${paresArr.length - 8} respostas</summary><div class="inner"><div class="grid g2">${paresMais}</div></div></details>` : ''}`) : '');
}

function prodSec(){
  const at = D.atendimento, A = at.analistas || []; if (!A.length) return '';
  const rows = A.map(a => `<tr><td class="who">${esc(a.quem)}<div class="sm">${esc(a.tipo)}</div></td>
     <td class="n"><b>${fmt(a.tickets)}</b></td>
     <td class="n">${fmt(a.finalizados)}<div class="sm">${fmt(a.resolvidos)} resolv. · ${fmt(a.fechados)} fech.</div></td>
     <td class="n">${a.abertos ? `<b style="color:var(--deep)">${fmt(a.abertos)}</b>` : '0'}</td>
     <td style="min-width:96px">${a.tickets ? meter([{v: a.respondidos, c: '#0E9F6E', l: 'respondidos'}, {v: a.tickets - a.respondidos, c: 'var(--line)', l: 'sem resposta'}], a.tickets) + `<div class="sm" style="margin-top:3px">${fmt(a.respondidos)} · ${pc(a.pct_resp)}</div>` : '<span class="sm">—</span>'}</td>
     <td class="n">${fmt(a.respostas_enviadas)}</td><td class="n">${esc(a.mediana_resp_label)}</td>
     <td class="n">${a.respondidos ? pc(a.pct_sla) : '—'}</td>
     <td class="n">${a.idade_media_abertos != null ? dec(a.idade_media_abertos) + 'd' : '—'}</td></tr>`).join('');
  const sem = at.respostas - (at.respostas_com_analista || 0);
  return sec('Produtividade por analista', `Por responsável atribuído ao ticket · SLA acordado: ${at.sla_h}h.`,
    `<div class="card"><div class="tscroll"><table class="t tw"><thead><tr><th>Analista / equipe</th><th class="n">Tickets</th><th class="n">Finalizados</th><th class="n">Em aberto</th><th>Respondidos</th><th class="n">Respostas enviadas</th><th class="n">1ª resp. (mediana)</th><th class="n">No SLA</th><th class="n">Idade abertos</th></tr></thead><tbody>${rows}</tbody></table></div>
     <div class="note">O MCP informa o responsável atribuído ao ticket, não quem o finalizou. “Respostas enviadas” conta o analista registrado na resposta; ${fmt(sem)} de ${fmt(at.respostas)} respostas do período não trazem esse registro (provável automação ou envio sem analista identificado).</div></div>`);
}
function csatSec(){
  const C = D.csat; if (!C || !C.n) return '';
  const nps = C.escala === 'nps', ks = Object.keys(C.distribuicao).map(Number).sort((a, b) => a - b), mx = Math.max(1, ...Object.values(C.distribuicao));
  const col = v => nps ? (v >= 9 ? '#0E9F6E' : v >= 7 ? '#F2A900' : '#E11D2E') : (v >= 4 ? '#0E9F6E' : v === 3 ? '#F2A900' : '#E11D2E');
  const dist = ks.map(k => `<div class="row" style="grid-template-columns:56px 1fr auto"><div class="rl">${k}${nps ? '' : ' ★'}</div><div class="hbar"><i style="width:${100 * C.distribuicao[k] / mx}%;background:${col(k)}"></i></div><div class="rv"><b>${fmt(C.distribuicao[k])}</b></div></div>`).join('');
  const an = (C.por_analista || []).map(a => `<div class="row" style="grid-template-columns:1fr auto auto"><div class="rl" style="font-size:12.5px">${esc(a.quem)}</div><div class="rv">${fmt(a.n)} resp.</div><div class="rv"><b>${dec(a.media, 1)}</b></div></div>`).join('');
  const com = (C.comentarios || []).map(c => `<div class="post"><div class="meta"><span class="who">@${esc(c.autor)}</span><span>· ${dh(c.quando)}</span>${c.nota != null ? `<span class="crit" style="background:${col(c.nota)};color:#fff">${c.nota}</span>` : ''}</div><div class="verb">${esc(c.texto)}</div></div>`).join('');
  return sec('Pesquisa de satisfação', `Respostas à pesquisa de satisfação do canal (${nps ? 'escala 0–10 · NPS' : 'escala 1–5 · CSAT'}). Leitura automática do campo de pesquisa — confira com o relatório da plataforma.`,
    `<div class="grid g4">${[kpi({num: fmt(C.n), lab: 'respostas de pesquisa', sub: `${fmt(C.com_nota)} com nota`, bar: '#1F6FB2'}),
      kpi({num: C.media != null ? dec(C.media, 1) : '—', lab: nps ? 'nota média (0–10)' : 'nota média (1–5)', bar: '#F2A900'}),
      kpi({num: pc(C.pct_satisfeitos), lab: nps ? 'promotores (9–10)' : 'satisfeitos (4–5)', bar: '#0E9F6E'}),
      kpi({num: C.nps != null ? fmt(C.nps) : '—', lab: 'NPS', sub: nps ? 'promotores − detratores' : 'só em escala 0–10', bar: '#FF6A13'})].join('')}</div>
     <div class="grid g3" style="margin-top:14px">${card('Distribuição das notas', dist)}${card('Por analista', an || '<div class="small">Sem analista associado.</div>')}${card('Comentários', `<div class="stack">${com || '<div class="small">Sem comentários escritos.</div>'}</div>`)}</div>`);
}
function prioSec(){
  const P = D.tickets.prioridades || []; if (!P.length) return '';
  const tot = sum(P.map(p => p.tickets)), sts = [...new Set(P.flatMap(p => Object.keys(p.por_status)))], cor = p => PRIO_COR[p] || '#cfc6bb';
  const rowsSt = P.map(p => `<div class="row" style="grid-template-columns:92px 1fr auto"><div class="rl"><span class="dot" style="background:${cor(p.prioridade)}"></span>${esc(p.prioridade)}</div>${meter(sts.map(st => ({v: p.por_status[st] || 0, c: STATUS_COR[st] || '#cfc6bb', l: st})), p.tickets)}<div class="rv"><b>${fmt(p.tickets)}</b></div></div>`).join('');
  const tab = P.map(p => `<tr><td><span class="tchip"><i style="background:${cor(p.prioridade)}"></i>${esc(p.prioridade)}</span></td><td class="n"><b>${fmt(p.tickets)}</b><div class="sm">${pc(p.pct)}</div></td><td class="n">${pc(p.pct_resp)}</td><td class="n">${esc(p.mediana_resp_label)}</td><td class="n">${p.respondidos ? pc(p.pct_sla) : '—'}</td><td class="n">${fmt(p.abertos)}</td><td class="n">${p.idade_media_abertos != null ? dec(p.idade_media_abertos) + 'd' : '—'}</td></tr>`).join('');
  return sec('Prioridade dos tickets', 'Prioridade registrada na plataforma — compare com a criticidade lida, logo abaixo.',
    `<div class="grid g2">${card('Tickets por prioridade', donut(P.map(p => ({l: p.prioridade, v: p.tickets, c: cor(p.prioridade)})), fmt(tot), 'tickets') + legend(P.map(p => ({c: cor(p.prioridade), l: `${esc(p.prioridade)} · ${fmt(p.tickets)}`}))))}
      ${card('Status por prioridade', rowsSt + legend(sts.map(st => ({c: STATUS_COR[st] || '#cfc6bb', l: st}))))}</div><div class="card" style="margin-top:14px"><h3>Atendimento por prioridade</h3><div class="tscroll"><table class="t"><thead><tr><th>Prioridade</th><th class="n">Tickets</th><th class="n">Respondidos</th><th class="n">1ª resposta (mediana)</th><th class="n">No SLA</th><th class="n">Em aberto</th><th class="n">Idade média dos abertos</th></tr></thead><tbody>${tab}</tbody></table></div></div>`);
}
function recSec(){
  const Pm = D.tickets.pessoas_multi_ticket || [], R = D.tickets.recorrentes || {}; if (!Pm.length) return '';
  const top = Pm.slice(0, 15), mx = Math.max(...top.map(p => p.tickets));
  const rows = top.map(p => `<div class="row" style="grid-template-columns:minmax(120px,220px) 1fr auto"><div class="rl" style="font-size:12.5px">@${esc(p.autor)}</div>
     <div><div class="sbar" style="width:${100 * p.tickets / mx}%">${p.abertos ? `<i style="width:${100 * p.abertos / p.tickets}%;background:#E8590C" title="em aberto: ${p.abertos}"></i>` : ''}${p.finalizados ? `<i style="width:${100 * p.finalizados / p.tickets}%;background:#0E9F6E" title="finalizados: ${p.finalizados}"></i>` : ''}</div></div>
     <div class="rv"><b>${fmt(p.tickets)}</b> tickets · ${fmt(p.respondidos)} resp.</div></div>`).join('');
  return sec(`Protocolos por pessoa · ${fmt(R.pessoas)} ${R.pessoas === 1 ? 'pessoa' : 'pessoas'} com 2 ou mais tickets`,
    `${fmt(R.tickets)} tickets (${pc(R.pct_tickets)} do total) vieram de quem abriu mais de um protocolo${Pm.length > 15 ? ' · as 15 com mais tickets' : ''}. Unificar os protocolos da mesma pessoa mostra o histórico inteiro a quem atende.`,
    `<div class="card">${rows}${legend([{c: '#E8590C', l: 'em aberto'}, {c: '#0E9F6E', l: 'finalizados'}])}</div>`);
}
function tagsSec(){
  const G = D.tags || {}, TT = G.ticket || [], TI = G.interacao || []; if (!TT.length && !TI.length) return '';
  const sm = x => meter([{v: x.pos, c: 'var(--pos)', l: 'positivo'}, {v: x.neu, c: 'var(--neu)', l: 'neutro'}, {v: x.neg, c: 'var(--neg)', l: 'negativo'}]);
  const rowT = t => `<div class="row" style="grid-template-columns:minmax(110px,180px) 1fr auto"><div class="rl">${esc(t.tag)}${t.frente ? '<span class="chip">frente</span>' : ''}</div>${sm(t.sent)}<div class="rv"><b>${fmt(t.n)}</b> · ${pc(t.pct)}</div></div>
     <div class="small" style="margin:-3px 0 8px">${pc(t.pct_resp)} respondidos · 1ª resposta ${esc(t.mediana_resp_label)} · ${fmt(t.finalizados)} finalizados · ${fmt(t.abertos)} em aberto${(t.temas_lidos || []).length ? ' · lido como: ' + t.temas_lidos.map(x => `${esc(x.tema)} ${pc(x.pct)}`).join(', ') : ''}</div>`;
  const rowI = t => `<div class="row" style="grid-template-columns:minmax(110px,180px) 1fr auto"><div class="rl">${esc(t.tag)}</div>${sm(t.sent)}<div class="rv"><b>${fmt(t.n)}</b> · ${pc(t.pct)}</div></div><div class="small" style="margin:-3px 0 8px">${fmt(t.respondidas)} respondidas (${pc(t.pct_resp)})</div>`;
  const sis = Object.entries(G.sistema || {}).map(([k, v]) => `${esc(k)} (${fmt(v)})`).join(', ');
  return sec('Tags aplicadas pela equipe', 'Rótulos que os analistas aplicam nos tickets e nas mensagens, com o sentimento das mensagens e a produtividade de cada tag. “Lido como” compara a tag com o tema lido em cada conversa.',
    `<div class="grid g2">${card(`Tags dos tickets · ${fmt(G.tickets_com_tag || 0)} tickets com tag`, TT.map(rowT).join('') || '<div class="small">Nenhuma tag nos tickets.</div>')}
      ${card(`Tags das mensagens · ${fmt(G.interacoes_com_tag || 0)} mensagens com tag`, TI.map(rowI).join('') || '<div class="small">Nenhuma tag nas mensagens.</div>')}</div>
     ${legend([{c: 'var(--pos)', l: 'positivo'}, {c: 'var(--neu)', l: 'neutro'}, {c: 'var(--neg)', l: 'negativo'}])}${sis ? `<div class="note">Tags de sistema, fora da contagem: ${sis}.</div>` : ''}`);
}

/* ================================================================ 4 · TICKETS */
function pageTickets(){
  const tk = D.tickets, fi = tk.finalizados_info || {};
  const frentes = (tk.frentes || []).map(f => `<div class="card"><h3>Frente · ${esc(f.frente)}</h3>
     <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end"><div><div class="big">${fmt(f.total)}</div><div class="small">tickets</div></div>
     <div><div class="big" style="color:${f.respondidos ? 'var(--ink)' : 'var(--red)'}">${fmt(f.respondidos)}</div><div class="small">respondidos</div></div>
     <div><div class="big">${fmt(f.abertos)}</div><div class="small">em aberto</div></div></div>
     <div style="margin-top:14px">${meter(Object.entries(f.prioridade).map(([k, v]) => ({v, c: PRIO_COR[k] || '#cfc6bb', l: k})), f.total)}</div>
     ${legend(Object.entries(f.prioridade).map(([k, v]) => ({c: PRIO_COR[k] || '#cfc6bb', l: `Prioridade ${esc(k)} · ${v}`})))}
     <div class="small" style="margin-top:10px">Responsável: ${Object.entries(f.responsavel).map(([k, v]) => `${esc(k)} (${v})`).join(', ')} · canal: ${Object.entries(f.canal).map(([k, v]) => `${esc(CANAL[k] || k)} ${v}`).join(', ')}<br>${fmt(f.obrigatorias)} exigiam resposta · ${fmt(f.crit_alta)} de criticidade alta · idade média dos abertos: ${f.idade_media != null ? dec(f.idade_media) + ' dias' : '—'}</div></div>`).join('');
  const px = tk.prio_x_crit;
  const pxt = `<div class="tscroll"><table class="t heat"><thead><tr><th>Prioridade (plataforma)</th>${px.crits.map(c => `<th class="c">Criticidade ${CRIT[c]}</th>`).join('')}</tr></thead><tbody>
     ${px.prioridades.map((p, i) => `<tr><td><span class="tchip"><i style="background:${PRIO_COR[p] || '#cfc6bb'}"></i>${esc(p)}</span></td>${px.m[i].map((v, j) => {
        const bad = (px.crits[j] === 'alta' && (p === 'Baixa' || p === '—'));
        return `<td class="c" style="${v ? (bad ? 'background:rgba(225,29,46,.16);color:var(--red)' : 'background:var(--bg2)') : 'color:var(--muted)'}">${v || '·'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  const altaBaixa = px.prioridades.reduce((a, p, i) => a + ((p === 'Baixa' || p === '—') ? px.m[i][px.crits.indexOf('alta')] : 0), 0);
  const altaTot = px.m.reduce((a, r) => a + r[px.crits.indexOf('alta')], 0);
  const resp = (tk.por_responsavel || []).map(r => `<div class="row"><div class="rl" style="font-size:12.5px">${esc(r.quem)}<span class="chip">${esc(r.tipo)}</span></div>
     ${meter(Object.entries(r.status).map(([k, v]) => ({v, c: STATUS_COR[k] || '#cfc6bb', l: k})), r.total)}<div class="rv"><b>${fmt(r.total)}</b></div></div>`).join('');
  const agingMax = Math.max(...tk.aging.map(a => a.n), 1);
  const aging = tk.aging.map(a => `<div class="row"><div class="rl">${esc(a.faixa)}</div><div class="hbar"><i style="width:${100 * a.n / agingMax}%;background:${/15|30/.test(a.faixa) ? '#E11D2E' : (/8/.test(a.faixa) ? '#E8590C' : '#F2A900')}"></i></div><div class="rv"><b>${fmt(a.n)}</b></div></div>`).join('');
  const fila = (tk.fila_critica || []).map(f => `<tr><td>${crit(f.crit)}</td><td class="who">@${esc(f.autor)}<div class="sm">${esc(f.tid)} · ${esc(CANAL[f.canal] || f.canal)} · ${esc(f.frente)}</div>${verBtn(f.link, f.canal) ? `<div style="margin-top:6px">${verBtn(f.link, f.canal)}</div>` : ''}</td>
     <td>${tchip(f.tema)}<div class="sm" style="margin-top:4px">${esc(f.assunto)}</div></td>
     <td class="res">${esc(f.resumo)}<div class="sm" style="margin-top:4px">“${esc(f.texto)}”</div></td>
     <td class="n">${dec(f.idade_dias)}d<div class="sm">${dd(f.aberto_em)}</div></td>
     <td><span class="tchip"><i style="background:${PRIO_COR[f.prio] || '#cfc6bb'}"></i>${esc(f.prio)}</span>${f.subpriorizado ? '<div class="sm" style="color:var(--red);margin-top:4px">subpriorizado</div>' : ''}${f.final ? '<div class="sm" style="color:var(--deep);margin-top:4px">finalizado sem resposta</div>' : ''}</td></tr>`).join('');
  const multi = (tk.pessoas_multi_ticket || []).map(p => `<span class="tchip">@${esc(p.autor)} · ${p.tickets} tickets</span>`).join(' ');
  const redes = (tk.por_rede || []).map(r => `<div class="row ${r.n ? '' : 'zero'}"><div class="rl"><span class="dot" style="background:${NET_COR[r.rede] || '#8a8178'}"></span>${esc(r.label)}</div><div class="hbar"><i style="width:${100 * r.n / (tk.total || 1)}%;background:${NET_COR[r.rede] || '#8a8178'}"></i></div><div class="rv">${r.n ? '<b>' + fmt(r.n) + '</b>' : '0'}</div></div>`).join('');
  const sts = Object.keys(tk.serie_status || {});
  onChart('tickets', 'c_status_dia', (w, h) => svgBars(w, h, {labels: DIAS, stacked: true, series: sts.map(st => ({name: st, color: STATUS_COR[st] || '#cfc6bb', data: tk.serie_status[st]}))}));
  onChart('tickets', 'c_fin_dia', (w, h) => svgBars(w, h, {labels: DIAS, series: [{name: 'Finalizados (por dia de abertura)', color: '#0E9F6E', data: tk.finalizados_por_dia}]}));
  return head('Tickets', 'A fila, por status, prioridade e responsável', esc((N.leituras || {}).tickets || ''))
   + `<div class="grid g6">${[
       kpi({num: fmt(tk.total), lab: 'tickets', delta: dl(K.tickets.d, null), sub: `${fmt(tk.multimsg)} com várias mensagens`, bar: '#FF6A13'}),
       kpi({num: fmt(tk.abertos), lab: 'em aberto', color: 'var(--deep)', sub: pc(K.abertos.pct) + ' do total', bar: '#E8590C'}),
       kpi({num: fmt(tk.finalizados), lab: 'finalizados', sub: `${fmt(fi.respondidos || 0)} com resposta registrada`, bar: '#0E9F6E'}),
       kpi({num: dec(tk.idade_media_d), lab: 'dias de idade média', sub: `mediana ${dec(tk.idade_mediana_d)} dias (abertos)`, bar: '#F2A900'}),
       kpi({num: fmt(K.fila_critica.v), lab: 'na fila crítica', color: 'var(--red)', sub: `${fmt(K.fila_critica.alta)} de criticidade alta`, bar: '#E11D2E'}),
       kpi({num: `${fmt(altaBaixa)}<small>/${fmt(altaTot)}</small>`, lab: 'graves com prioridade Baixa', color: altaBaixa ? 'var(--red)' : null, sub: 'criticidade lida × prioridade da plataforma', bar: '#E11D2E'})].join('')}</div>`
   + `<div class="grid g3" style="margin-top:14px">${card('Status atual', donut(tk.por_status.map(x => ({l: x.status, v: x.n, c: STATUS_COR[x.status] || '#cfc6bb'})), fmt(tk.total), 'tickets') + legend(tk.por_status.map(x => ({c: STATUS_COR[x.status] || '#cfc6bb', l: `${esc(x.status)} · ${x.n}`}))))}
       ${card('Status por dia de abertura', canvas('c_status_dia', 'sm') + legend(sts.map(st => ({c: STATUS_COR[st] || '#cfc6bb', l: st}))) + `<div class="note">${fi.n ? `Os ${fmt(fi.n)} tickets finalizados foram abertos em ${(fi.abertos_em || []).map(dd).join(', ')}.` : 'Nenhum ticket finalizado.'}</div>`, 's2')}</div>`
   + sec('Por frente', 'Cada frente é uma tag de ticket na plataforma; prioridade e responsável vêm do registro.', `<div class="grid g2">${frentes}</div>`)
   + prioSec()
   + `<div class="grid g2" style="margin-top:14px">${card('Prioridade da plataforma × criticidade lida', pxt + `<div class="note">Células em vermelho: casos de criticidade alta que estavam com prioridade Baixa.</div>`)}
       ${card('Por responsável', resp + legend(Object.keys(STATUS_COR).filter(s => tk.por_status.some(x => x.status === s)).map(s => ({c: STATUS_COR[s], l: s}))))}</div>`
   + `<div class="grid g3" style="margin-top:14px">${card('Idade dos tickets em aberto', aging)}${card('Finalizados por dia de abertura', canvas('c_fin_dia', 'xs'))}${card('Tickets por rede', redes)}</div>`
   + recSec()
   + sec(`Fila crítica · ${fmt((tk.fila_critica || []).length)} conversas`, 'Exigem resposta e não têm resposta registrada — inclusive as que foram finalizadas sem resposta. Ordem: criticidade, depois idade.',
       `<div class="card"><div class="tscroll"><table class="t"><thead><tr><th>Crit.</th><th>Pessoa</th><th>Tema / assunto</th><th>O que aconteceu</th><th class="n">Idade</th><th>Prioridade</th></tr></thead><tbody>${fila || '<tr><td colspan="6" class="small">Nenhuma conversa obrigatória sem resposta. 🎉</td></tr>'}</tbody></table></div>
        </div>`);
}

/* ================================================================ 5 · TEMAS */
function pageTemas(){
  const tm = D.temas, lista = tm.lista.filter(t => t.n);
  const tab = lista.map(t => `<tr><td><span class="tchip"><i style="background:${t.cor}"></i>${esc(t.tema)}</span>${t.core ? '' : ' <span class="sm">fora do escopo</span>'}</td><td class="n"><b>${fmt(t.n)}</b></td><td class="n">${pc(t.pct)}</td><td class="n">${fmt(t.obrigatorias)}</td><td class="n">${fmt(t.respondidas)}</td></tr>`).join('');
  const blocks = lista.map(t => {
    const subs = (tm.subtemas[t.tema] || []);
    const vis = subs.slice(0, 6), hid = subs.slice(6);
    const rows = vis.map(s => `<div class="row" style="grid-template-columns:1fr auto"><div class="rl" style="font-weight:500;font-size:13px">${esc(s.subtema)}</div><div class="rv"><b>${fmt(s.n)}</b>${s.respondidas ? ` · ${s.respondidas} resp.` : ''}</div></div>`).join('')
      + (hid.length ? `<div class="small" style="padding:7px 0">+ ${hid.length} outros subtemas (${fmt(sum(hid.map(h => h.n)))} conversas)</div>` : '');
    const cut = (x, n) => x.length > n ? x.slice(0, n).trimEnd() + '…' : x;
    const exs = subs.flatMap(s => s.exemplos.slice(0, 1)).slice(0, 2).map(e => `<div class="post" style="margin-top:8px"><div class="meta"><span class="who">@${esc(e.autor)}</span><span>${esc(CANAL[e.canal] || e.canal)}</span><span>· ${dd(e.quando)}</span>${e.respondido ? '<span>· respondida</span>' : ''}${verBtn(e.link, e.canal)}</div><div class="verb">${e.texto && e.texto[0] !== '<' ? '“' + esc(cut(e.texto, 170)) + '”' : '<span class="small">' + esc(e.resumo) + '</span>'}</div></div>`).join('');
    return `<div class="card"><h3 style="display:flex;justify-content:space-between;gap:8px"><span style="display:flex;align-items:center;gap:7px"><i style="width:10px;height:10px;border-radius:3px;background:${t.cor};display:inline-block"></i>${esc(t.tema)}</span><span>${fmt(t.n)} · ${pc(t.pct)}</span></h3>
      <div class="ch-sub">${esc(t.desc)}</div>${rows}${exs}</div>`;
  }).join('');
  const ass = tm.assuntos;
  const assTab = ass.map(a => `<tr><td>${esc(a.assunto)}</td><td class="n"><b>${fmt(a.n)}</b></td><td class="n">${fmt(a.obrigatorias)}</td><td class="n">${fmt(a.respondidas)}</td><td class="n">${a.crit_alta ? `<span style="color:var(--red);font-weight:600">${a.crit_alta}</span>` : '·'}</td></tr>`).join('');
  const heat = (x, title) => {
    const max = Math.max(1, ...x.m.flat());
    const cols = x.temas.filter((t, j) => x.m.some(r => r[j]));
    const idx = cols.map(c => x.temas.indexOf(c));
    return card(title, `<div class="tscroll"><table class="t heat"><thead><tr><th></th>${cols.map(c => `<th class="c" title="${esc(c)}"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TEMA_COR[c]}"></i> ${esc(SHORT[c] || c)}</th>`).join('')}<th class="n">Total</th></tr></thead>
      <tbody>${x.linhas.map((l, i) => `<tr><td class="who">${esc(CANAL[l] || l)}</td>${idx.map(j => { const v = x.m[i][j]; return `<td class="c" style="${v ? `background:rgba(255,106,19,${(0.08 + 0.42 * v / max).toFixed(2)})` : 'color:var(--muted)'}">${v || '·'}</td>`; }).join('')}<td class="n"><b>${fmt(x.tot[i])}</b></td></tr>`).join('')}</tbody></table></div>`);
  };
  const core = K.core_sac;
  const recl = tm.lista.find(t => t.tema === 'Reclamação') || {n: 0};
  const topT = [...lista].filter(t => t.core).sort((a, b) => b.n - a.n)[0];
  onChart('temas', 'c_temas_dia', (w, h) => svgBars(w, h, {labels: DIAS, stacked: true, series: lista.map(t => ({name: t.tema, color: t.cor, data: tm.serie[t.tema]}))}));
  const assMax = Math.max(1, ...ass.map(a => a.n));
  const assRows = ass.map(a => `<div class="row arow"><div class="rl" style="font-weight:500;font-size:12.5px">${esc(a.assunto)}</div>
     <div class="abar"><div class="sbar" style="width:${100 * a.n / assMax}%">${lista.map(t => { const v = a.por_tema[t.tema] || 0; return v ? `<i style="width:${100 * v / a.n}%;background:${t.cor}" title="${esc(t.tema)}: ${v}"></i>` : ''; }).join('')}</div></div>
     <div class="rv"><b>${fmt(a.n)}</b></div></div>`).join('');
  return head('Temas & classificações', 'Do que as pessoas estão falando', esc((N.leituras || {}).temas || ''))
   + `<div class="grid g4">${[
       kpi({num: fmt(core.v), lab: 'tickets de SAC', sub: 'dúvida, solicitação, reclamação, elogio', bar: '#1F6FB2'}),
       kpi({num: fmt(core.fora), lab: 'tickets fora do escopo', sub: 'ruído, mídia sem texto, propostas de terceiros', bar: '#cfc6bb'}),
       kpi({num: topT ? fmt(topT.n) : '—', lab: topT ? 'maior tema: ' + esc(topT.tema) : 'maior tema', sub: topT ? pc(topT.pct) + ' das demandas' : '', bar: topT ? topT.cor : '#cfc6bb'}),
       kpi({num: fmt(recl.n), lab: 'reclamações', color: 'var(--deep)', sub: `${fmt(recl.respondidas || 0)} respondida(s) · ${fmt(recl.com_negativo || 0)} marcada(s) como negativa`, bar: '#E8590C'})].join('')}</div>`
   + `<div class="grid g3" style="margin-top:14px">${card('Temas acionados', donut(lista.map(t => ({l: t.tema, v: t.n, c: t.cor})), fmt(sum(lista.map(t => t.n))), 'demandas') + `<div class="tscroll" style="margin-top:10px"><table class="t"><thead><tr><th>Tema</th><th class="n">N</th><th class="n">%</th><th class="n">Obrig.</th><th class="n">Resp.</th></tr></thead><tbody>${tab}</tbody></table></div>`)}
       ${card('Evolução diária por tema', canvas('c_temas_dia', 'lg') + legend(lista.map(t => ({c: t.cor, l: t.tema}))), 's2')}</div>`
   + sec('Leitura por tema', 'Subtemas identificados lendo cada conversa, com exemplos reais.', `<div class="grid g3">${blocks}</div>`)
   + tagsSec()
   + sec('Assuntos', 'Recorte por assunto (equivalente às classificações de produto, pagamento e atendimento da plataforma), empilhado por tema.',
       `<div class="grid g3">${card('Assuntos por tema', assRows + legend(lista.map(t => ({c: t.cor, l: t.tema}))), 's2')}
        ${card('Exigência e resposta por assunto', `<div class="tscroll"><table class="t"><thead><tr><th>Assunto</th><th class="n">N</th><th class="n">Obrig.</th><th class="n">Resp.</th><th class="n">Alta</th></tr></thead><tbody>${assTab}</tbody></table></div>`)}</div>`)
   + `<div class="grid g2" style="margin-top:14px">${heat(tm.frente_x_tema, 'Frente × tema')}${heat(tm.canal_x_tema, 'Canal × tema')}</div>`;
}

/* ================================================================ 6 · AVALIAÇÃO */
function pageAval(){
  const av = D.avaliacao, semResp = !av.n_respostas || av.pilar_a == null;
  const g = gauge({value: av.iaa, max: 10, label: dec(av.iaa), vsize: 40, aria: 'Índice de Avaliação do Atendimento',
    bands: [{from: 0, to: 5, color: '#E11D2E'}, {from: 5, to: 7, color: '#F2A900'}, {from: 7, to: 8.5, color: '#7BB662'}, {from: 8.5, to: 10, color: '#0E9F6E'}],
    ticks: [{v: 0, l: '0'}, {v: 5, l: '5'}, {v: 7, l: '7'}, {v: 8.5, l: '8,5'}, {v: 10, l: '10'}]});
  const crits = av.criterios.map(c => `<div class="pilar"><div class="pn">${esc(c.label)} <span class="small mono">peso ${String(c.peso).replace('.', ',')}</span></div><div class="pd">${esc(c.desc)}${c.n < av.n_respostas ? ` · avaliado em ${c.n} de ${av.n_respostas}` : ''}</div>
     <div class="pv" style="color:${scoreColor(c.media)}">${c.media != null ? dec(c.media) : '—'}</div>${meter([{v: c.media || 0, c: scoreColor(c.media)}], 10)}</div>`).join('');
  const comps = av.componentes_b.map(c => `<div class="pilar"><div class="pn">${esc(c.label)} <span class="small mono">peso ${dec(100 * c.peso, 0)}%</span></div><div class="pd mono" style="font-size:11px">${esc(c.formula)}</div>
     <div class="pv" style="color:${scoreColor(c.valor)}">${dec(c.valor)}</div>${meter([{v: c.valor, c: scoreColor(c.valor)}], 10)}</div>`).join('');
  const R = av.respostas.filter(r => !r.excluida), byId = Object.fromEntries(av.respostas.map(r => [r.rid, r]));
  const heatT = `<div class="tscroll"><table class="t heat"><thead><tr><th>Resposta</th>${av.criterios.map(c => `<th class="c" title="${esc(c.label)}">${esc(c.label.replace('Uso correto da língua', 'Língua'))}</th>`).join('')}<th class="c">Nota</th></tr></thead><tbody>
     ${[...R].sort((a, b) => (b.nota || 0) - (a.nota || 0)).map(r => `<tr><td class="who">${esc(r.rid)} · @${esc(r.autor || '?')}<div class="sm">${esc(r.subtema || '')}</div></td>${av.criterios.map(c => { const v = r.notas[c.k];
        return `<td class="c" style="${v == null ? 'color:var(--muted)' : `background:${scoreColor(v)}${v >= 8 ? '26' : (v >= 6 ? '2e' : '26')};color:${scoreColor(v)}`}">${v == null ? 'n/a' : v}</td>`; }).join('')}
       <td class="c" style="background:${r.faixa.cor};color:#fff">${dec(r.nota)}</td></tr>`).join('')}</tbody></table></div>`;
  const ev = r => `<div class="card"><div class="post" style="background:none;border:none;padding:0"><div class="meta"><span class="crit" style="background:${r.faixa.cor};color:#fff">nota ${dec(r.nota)}</span><span class="who">${esc(r.rid)} · @${esc(r.autor || '?')}</span><span>· ${dh(r.quando)}</span><span>· ${esc(r.tempo_label)}</span>${verBtn(r.link, r.canal)}</div></div>
     <div class="pair"><div class="bubble in"><span class="bl">Mensagem original</span>${textOrDash(r.msg)}</div>
     <div class="bubble out"><span class="bl">Resposta da marca</span>${esc(r.resposta)}</div>
     <div class="why"><b>Por que essa nota:</b> ${esc(r.justificativa)}</div>
     ${r.sugestao ? `<div class="bubble sug"><span class="bl">Como poderia ser</span>${esc(r.sugestao)}</div>` : ''}</div></div>`;
  const best = (av.melhores || []).map(id => byId[id]).filter(Boolean), worst = (av.piores || []).map(id => byId[id]).filter(Boolean);
  const shown = new Set([...av.melhores, ...av.piores]);
  const rest = [...R].filter(r => !shown.has(r.rid)).sort((a, b) => (b.nota || 0) - (a.nota || 0));
  const sr = (av.sem_resposta_obrig || []).map(x => `<div class="row" style="grid-template-columns:1fr auto auto"><div class="rl" style="font-weight:500;font-size:13px">${esc(x.assunto)}</div><div class="hbar" style="width:110px"><i style="width:${100 * x.n / (av.sem_resposta_obrig[0].n || 1)}%;background:#E11D2E"></i></div><div class="rv"><b>${fmt(x.n)}</b></div></div>`).join('');
  const cen = (av.cenarios || []).map(c => `<div class="row" style="grid-template-columns:1fr auto"><div class="rl" style="font-weight:500;font-size:13px">${esc(c.titulo)}</div><div class="rv"><b style="font-size:15px;color:${(av.faixas.find(f => c.iaa >= f.min) || {}).cor}">${dec(c.iaa)}</b></div></div>`).join('');
  const rub = av.rubrica || [];
  const rubT = rub.length ? `<details class="more"><summary>Rubrica de notas por critério</summary><div class="inner"><div class="tscroll"><table class="t"><thead><tr><th>Critério</th><th>0–3</th><th>4–6</th><th>7–8</th><th>9–10</th></tr></thead><tbody>
     ${rub.map(x => `<tr><td class="who">${esc(x.label)}</td>${x.ancoras.map(a => `<td class="sm" style="min-width:150px">${esc(a)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></details>` : '';
  const cons = av.consistencia || {};
  return head('Avaliação do atendimento', `Índice de Avaliação do Atendimento: ${dec(av.iaa)} · ${esc(av.faixa.label)}`, esc((N.leituras || {}).avaliacao || ''))
   + `<div class="grid g3">${card('IAA · 0 a 10', `<div class="gwrap">${g}<span class="band" style="background:${av.faixa.cor}">${esc(av.faixa.label)}</span>
        <div class="formula">${semResp ? `IAA = <b>Cobertura & processo ${dec(av.pilar_b)}</b> (sem respostas para avaliar)` : `IAA = ${dec(av.peso_a, 1)} × <b>Qualidade ${dec(av.pilar_a)}</b> + ${dec(av.peso_b, 1)} × <b>Cobertura & processo ${dec(av.pilar_b)}</b>`}</div>
        ${legend(av.faixas.map((f, i) => ({c: f.cor, l: `${esc(f.label)} ${i === av.faixas.length - 1 ? '< ' + String(av.faixas[i - 1] ? av.faixas[i - 1].min : f.min).replace('.', ',') : '≥ ' + String(f.min).replace('.', ',')}`})))}</div>`)}
      ${card(`Pilar A · Qualidade das respostas · ${dec(av.pilar_a)}`, semResp ? '<div class="small">Nenhuma resposta da marca foi registrada no período, então não há qualidade a avaliar. O índice usa só o Pilar B.</div>' : `<div class="ch-sub">Média ponderada dos critérios em cada uma das ${fmt(av.n_respostas)} respostas.</div>` + crits)}
      ${card(`Pilar B · Cobertura & processo · ${dec(av.pilar_b)}`, `<div class="ch-sub">O que a marca deixou de responder também conta.</div>` + comps
        + (cons.justificativa ? `<div class="note" style="font-style:normal"><b style="color:var(--ink)">Consistência ${dec(cons.nota)}:</b> ${esc(cons.justificativa)}</div>` : ''))}</div>`
   + (semResp ? '' : sec('Nota por resposta e por critério', 'Verde ≥ 8 · âmbar 6 a 7,9 · vermelho < 6. Empatia só é avaliada quando há conflito.', `<div class="card">${heatT}</div>`)
   + sec(best.length + worst.length > 1 ? 'Melhores e piores respostas' : 'Resposta avaliada', 'Mensagem original, resposta da marca, justificativa da nota e uma reescrita sugerida.',
       `<div class="grid g2">${best.map(ev).join('')}</div>${worst.filter(w => !av.melhores.includes(w.rid)).length ? `<div class="grid g2" style="margin-top:14px">${worst.filter(w => !av.melhores.includes(w.rid)).map(ev).join('')}</div>` : ''}`
       + (rest.length ? `<details class="more"><summary>As outras ${rest.length} respostas avaliadas</summary><div class="inner"><div class="grid g2">${rest.map(ev).join('')}</div></div></details>` : '')))
   + `<div class="grid g2 sec">${card(`O que pesa contra · ${fmt(av.sem_resposta_obrig_total)} obrigatórias sem resposta`, sr + '<div class="note">Essas conversas não entram no Pilar A (não há resposta para avaliar), mas derrubam a cobertura do Pilar B.</div>')}
       ${card('Cenários', `<div class="row" style="grid-template-columns:1fr auto"><div class="rl" style="font-weight:500;font-size:13px">Hoje</div><div class="rv"><b style="font-size:15px;color:${av.faixa.cor}">${dec(av.iaa)}</b></div></div>` + cen + '<div class="note">Simulações com a mesma fórmula, mudando só o que está descrito.</div>')}</div>`
   + foraSec(av) + rubT;
}

function foraSec(av){
  const F = av.fora_do_fluxo || []; if (!F.length) return '';
  return sec(`Mensagens fora do fluxo de resposta · ${fmt(F.length)}`, 'Enviadas pela marca, mas não são resposta a uma demanda — ficam fora da nota.',
    `<div class="grid g2">${F.map(r => `<div class="card"><div class="post" style="background:none;border:none;padding:0"><div class="meta"><span class="who">${esc(r.rid)}</span><span>${esc(CANAL[r.canal] || r.canal)}</span><span>· ${dh(r.quando)}</span><span>· ${esc(r.enviado_por || '')}</span></div></div>
      <div class="bubble out"><span class="bl">Mensagem da marca</span>${esc(r.resposta)}</div><div class="why" style="margin-top:8px"><b>Por que ficou fora:</b> ${esc(r.motivo_exclusao)}</div>${r.justificativa ? `<div class="why" style="margin-top:4px"><b>Leitura:</b> ${esc(r.justificativa)}</div>` : ''}</div>`).join('')}</div>`);
}

/* ================================================================ 7 · RECOMENDAÇÕES */
function pageRec(){
  const recs = (N.recomendacoes || []).map(r => `<div class="ins ${r.kind || 'info'}"><div class="tag"><span class="tagk ${r.kind || 'info'}">${({risk:'risco',opp:'oportunidade',info:'ajuste'})[r.kind] || 'ajuste'}</span>${r.prazo ? `<span class="chip">prazo: ${esc(r.prazo)}</span>` : ''}${r.dono ? `<span class="chip">dono: ${esc(r.dono)}</span>` : ''}</div>
     <h4>${esc(r.titulo)}</h4><div class="mot">${esc(r.motivo)}</div>
     <div class="plan"><b>Plano de ação</b>${esc(r.plano)}</div>${r.impacto ? `<div class="plan"><b>Impacto esperado</b>${esc(r.impacto)}</div>` : ''}</div>`).join('');
  return head('Recomendações', 'O que fazer agora', esc((N.leituras || {}).recomendacoes || ''))
   + (recs ? `<div class="grid g2">${recs}</div>` : '<div class="small">Sem recomendações registradas.</div>');
}

/* ---------------------------------------------------------------- montagem */
const TABS = [
  {id: 'visao', label: 'Visão geral', fn: pageVisao}, {id: 'depoimentos', label: 'Depoimentos', fn: pageDepo},
  {id: 'atendimento', label: 'Atendimento & produtividade', fn: pageAtend}, {id: 'tickets', label: 'Tickets', fn: pageTickets},
  {id: 'temas', label: 'Temas & classificações', fn: pageTemas}, {id: 'avaliacao', label: 'Avaliação do atendimento', fn: pageAval},
  {id: 'recomendacoes', label: 'Recomendações', fn: pageRec}];
document.getElementById('htitle').innerHTML = `<b>${esc(M.marca || M.conta || 'Marca')} · Gestão de SAC</b><br>${esc(M.periodo.label)} &nbsp;<span class="chip">CRM · ${fmt((M.canais || []).length)} canais</span>`;
const nav = document.getElementById('tabs'), pages = document.getElementById('pages');
nav.innerHTML = TABS.map(t => `<button type="button" role="tab" id="tab-${t.id}" aria-controls="p-${t.id}" aria-selected="false" data-tab="${t.id}">${t.label}</button>`).join('');
pages.innerHTML = TABS.map(t => { let h = ''; try { h = t.fn(); } catch (e) { console.error(e); h = `<div class="card">Não foi possível montar esta aba (${esc(e.message)}).</div>`; }
  return `<section class="page" id="p-${t.id}" role="tabpanel" aria-labelledby="tab-${t.id}">${h}</section>`; }).join('');
function show(id, push){
  if (!TABS.some(t => t.id === id)) id = TABS[0].id;
  TABS.forEach(t => { const on = t.id === id; document.getElementById('p-' + t.id).classList.toggle('active', on); document.getElementById('tab-' + t.id).setAttribute('aria-selected', on ? 'true' : 'false'); });
  CUR = id; buildCharts(id);
  if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) {} window.scrollTo({top: 0}); }
  const b = document.getElementById('tab-' + id); if (b && b.scrollIntoView) b.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
nav.addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab, true); });
nav.addEventListener('keydown', e => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; const ids = TABS.map(t => t.id);
  const cur = ids.indexOf((nav.querySelector('[aria-selected="true"]') || {}).dataset.tab); const nx = ids[(cur + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
  show(nx, true); document.getElementById('tab-' + nx).focus(); });
pages.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) show(b.dataset.goto, true); });
show((location.hash || '').slice(1), false);

const canaisTxt = (M.canais || []).map(c => `${esc(c.rede_label)} ${esc(c.nome)}`).join(', ');
const extra = (N.notas_metodo || []).map(n => `<li>${esc(n)}</li>`).join('');
document.getElementById('method').innerHTML = `<h3>Nota metodológica · como ler estes números</h3><ul>
 <li><b>Fonte:</b> caixa de entrada do CRM da conta <b>${esc(M.conta || '')}</b> no Buzzmonitor (tool <span class="mono">search_account_posts</span> com os ${fmt((M.canais || []).length)} canais conectados: ${canaisTxt}). Período: <b>${esc(M.periodo.label)}</b> (${fmt(M.periodo.dias)} dias)${M.anterior_label ? `, comparado a ${esc(M.anterior_label)}` : ''}.</li>
 <li><b>Censo, sem amostra:</b> ${fmt(cont.registros_no_periodo)} registros no período, separados em <b>interações recebidas</b> (${fmt(D.depoimentos.total)}), <b>publicações próprias</b> (${fmt(D.publicacoes.total)}) e <b>respostas da marca</b> (${fmt(at.respostas)}). As datas da API vêm em UTC e foram convertidas para o horário de Brasília (UTC${M.tz >= 0 ? '+' : ''}${M.tz}).</li>
 <li><b>Unidade de demanda = ticket:</b> as mensagens de um mesmo protocolo foram agrupadas numa única conversa. Status, prioridade, frente (tag) e responsável vêm do ticket no momento da coleta — é uma fotografia, não o histórico de mudanças.</li>
 <li><b>Pareamento resposta ↔ mensagem:</b> em comentários, a resposta da marca foi ligada à mensagem mais recente da mesma publicação; em mensagens privadas, à mesma conversa (no Direct, pelo ID da Meta decodificado) ou ao mesmo protocolo de ticket. O tempo de resposta é medido da 1ª mensagem do ticket até a 1ª resposta. “Provável automação” = resposta em menos de 60 s sem analista no registro.</li>
 <li><b>Temas, exigência de resposta e criticidade</b> vêm da <b>leitura de cada conversa</b> (Claude), não de dicionário. “Exige resposta” separa o que é obrigatório (pergunta, problema, lead), recomendável (engajamento) e dispensável (ruído, spam, oferta genérica).</li>
 <li><b>Sentimento</b> é o automático do Buzzmonitor; as divergências com a leitura estão na aba Depoimentos.</li>
 <li><b>IAA</b> (0–10) = ${dec(D.avaliacao.peso_a, 1)} × Qualidade das respostas (8 critérios com pesos, notas por leitura) + ${dec(D.avaliacao.peso_b, 1)} × Cobertura & processo (cobertura das obrigatórias, agilidade frente ao SLA de ${M.sla_h}h, resolução e consistência). Com ${fmt(D.avaliacao.n_respostas)} respostas avaliadas, o Pilar A é indicativo.</li>
 <li><b>Limites:</b> respostas enviadas fora da plataforma (app nativo de cada rede ou canais não conectados ao CRM) não aparecem como resposta. Redes sem nenhum registro podem indicar ausência de demanda ou conexão inativa.</li>
 <li><b>Produtividade:</b> por responsável atribuído ao ticket no momento da coleta — o MCP não informa quem finalizou. “Respostas enviadas” usa o analista registrado na resposta (<span class="mono">reply_sent_by_login</span>).</li>
 ${D.csat ? '' : '<li><b>Pesquisa de satisfação:</b> nenhuma resposta de pesquisa no período. A seção aparece quando a conta usa a pesquisa de satisfação do canal (identificada pelo <span class="mono">content_type</span>).</li>'}
 ${extra}</ul>
